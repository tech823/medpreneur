name: OIDC Debug

on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'PY'
          import sys,json,base64
          p=sys.argv[1].split('.')[1]; p+='='*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ('iss','aud','sub','repository','repository_owner','ref','job_workflow_ref'):
              print(k, '=', c.get(k))
          PY

      - name: Try assuming AWS role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::461958694198:role/github-oidc-medpreneur-deploy
          aws-region: us-east-1
          retry-max-attempts: 1

      - name: Who am I
        run: aws sts get-caller-identity